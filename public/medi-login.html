<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>upload</title>
<style>
  :root { --paper:#f4f1e8; --ink:#2a2723; --soft:#6a655c; --accent:#8a4a2a; --line:rgba(0,0,0,.14); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .wrap { max-width:40rem; margin:0 auto; padding:56px 22px 90px; }
  h1 { font-size:22px; font-weight:500; margin:0 0 4px; }
  .lede { margin:0 0 34px; color:var(--soft); font-size:14px; }
  label { display:block; font-size:13px; color:var(--soft); margin:20px 0 6px; }
  input[type=text], input[type=password], textarea {
    width:100%; padding:10px 12px; font:inherit; color:var(--ink);
    background:#fbf9f4; border:1px solid var(--line); border-radius:4px;
  }
  textarea { min-height:74px; resize:vertical; }
  input[type=file] { font:inherit; font-size:13px; }
  .drop { margin-top:8px; padding:26px; text-align:center; border:1.5px dashed var(--line);
          border-radius:6px; background:#fbf9f4; cursor:pointer; }
  .drop.over { border-color:var(--accent); background:#f7f0e6; }
  .drop p { margin:0; font-size:13px; color:var(--soft); }
  #thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  #thumbs figure { margin:0; width:76px; }
  #thumbs img, #thumbs video { width:76px; height:76px; object-fit:cover; border-radius:3px;
                               box-shadow:0 1px 4px rgba(0,0,0,.2); display:block; }
  #thumbs figcaption { font-size:10.5px; color:var(--soft); margin-top:3px; text-align:center; }
  button { margin-top:28px; padding:11px 20px; font:inherit; background:var(--ink); color:var(--paper);
           border:0; border-radius:4px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #log { margin-top:22px; font:13px/1.6 ui-monospace, Menlo, monospace; white-space:pre-wrap;
         color:var(--soft); }
  .err { color:#a33; }
  .ok { color:#2a6a3a; }
  .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:16px; }
  .bar span { display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>upload</h1>
  <p class="lede">Adds a piece to the wall. Commits to the repo, which redeploys automatically. Give it a minute or two to appear.</p>

  <label for="key">password</label>
  <input id="key" type="password" autocomplete="current-password" spellcheck="false">

  <label for="title">title</label>
  <input id="title" type="text" placeholder="what this is called">

  <label for="label">label — appears on the back of the piece</label>
  <textarea id="label" placeholder="a line about it"></textarea>

  <label>files — one image, several for an album, or one video</label>
  <div class="drop" id="drop">
    <p>drop files here, or click to choose</p>
    <input id="file" type="file" accept="image/*,video/mp4,video/quicktime" multiple hidden>
  </div>
  <div id="thumbs"></div>

  <div class="bar"><span id="bar"></span></div>
  <button id="go" disabled>upload</button>
  <div id="log"></div>
</div>

<script type="module">
const MAX_EDGE = 1600;       // matches the build's `final` size; larger is wasted bytes
const JPEG_QUALITY = 0.86;
const MAX_BYTES = 4 * 1024 * 1024;

const $ = (id) => document.getElementById(id);
const log = (msg, cls = '') => {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  $('log').appendChild(line);
};

let files = [];

$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', (e) => {
  e.preventDefault();
  $('drop').classList.remove('over');
  take([...e.dataTransfer.files]);
});
$('file').addEventListener('change', (e) => take([...e.target.files]));

function take(list) {
  files = list;
  $('thumbs').innerHTML = '';
  for (const f of files) {
    const fig = document.createElement('figure');
    const el = f.type.startsWith('video') ? document.createElement('video') : document.createElement('img');
    el.src = URL.createObjectURL(f);
    if (el.tagName === 'VIDEO') { el.muted = true; el.playsInline = true; }
    const cap = document.createElement('figcaption');
    cap.textContent = `${(f.size / 1048576).toFixed(1)}MB`;
    fig.append(el, cap);
    $('thumbs').appendChild(fig);
  }
  $('go').disabled = files.length === 0;
}

// Images are downscaled in the browser. A 3MB phone photo becomes about 300KB,
// which keeps every request well inside the serverless body limit and matches what
// the build would produce anyway.
function downscale(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('encode failed'))), 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => reject(new Error(`could not read ${file.name}`));
    img.src = URL.createObjectURL(file);
  });
}

// A video needs a still for the wall face. The server has no ffmpeg, so the frame
// is grabbed here, a little way in — the opening frames of a timelapse are usually
// a blank canvas.
function posterFrame(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'metadata';
    v.onloadedmetadata = () => { v.currentTime = Math.min(v.duration * 0.4, v.duration - 0.1); };
    v.onseeked = () => {
      const canvas = document.createElement('canvas');
      canvas.width = v.videoWidth;
      canvas.height = v.videoHeight;
      canvas.getContext('2d').drawImage(v, 0, 0);
      URL.revokeObjectURL(v.src);
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('poster failed'))), 'image/jpeg', 0.9);
    };
    v.onerror = () => reject(new Error('could not read the video'));
    v.src = URL.createObjectURL(file);
  });
}

const toBase64 = (blob) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result.split(',')[1]);
  r.onerror = () => reject(new Error('read failed'));
  r.readAsDataURL(blob);
});

async function post(body) {
  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-medi-key': $('key').value },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({ error: `http ${res.status}` }));
  if (!res.ok) throw new Error(json.error ?? `http ${res.status}`);
  return json;
}

async function uploadBlob(blob, type, name) {
  if (blob.size > MAX_BYTES) {
    throw new Error(`${name} is ${(blob.size / 1048576).toFixed(1)}MB after processing — too large`);
  }
  const { sha } = await post({ action: 'blob', type, data: await toBase64(blob) });
  return sha;
}

$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  $('log').innerHTML = '';
  const bar = $('bar');

  try {
    if (!$('key').value) throw new Error('password first');
    if (!$('title').value.trim()) throw new Error('give it a title');

    const video = files.find((f) => f.type.startsWith('video'));
    const images = files.filter((f) => !f.type.startsWith('video'));
    const total = files.length + (video ? 1 : 0);
    let done = 0;
    const tick = () => { bar.style.width = `${Math.round((++done / (total + 1)) * 100)}%`; };

    const sheets = [];
    for (const f of images) {
      log(`processing ${f.name}…`);
      const sha = await uploadBlob(await downscale(f), 'image/jpeg', f.name);
      sheets.push({ sha });
      tick();
    }

    let videoRef = null;
    let posterSha = null;
    if (video) {
      log('grabbing a poster frame…');
      posterSha = await uploadBlob(await posterFrame(video), 'image/jpeg', 'poster');
      tick();
      log(`uploading ${video.name}…`);
      videoRef = { sha: await uploadBlob(video, video.type, video.name) };
      tick();
      if (!sheets.length) sheets.push({ sha: posterSha });
    }

    log('committing…');
    const out = await post({
      action: 'commit',
      title: $('title').value.trim(),
      label: $('label').value.trim(),
      sheets,
      video: videoRef,
      posterSha,
    });
    bar.style.width = '100%';
    log(`committed ${out.commit.slice(0, 7)} as "${out.id}" — ${out.files} files`, 'ok');
    log('Vercel is rebuilding. It will be on the wall shortly.', 'ok');
  } catch (err) {
    log(err.message, 'err');
    bar.style.width = '0';
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
